<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFESORES - EDUMATCH</title>
    <style>
        /* Variables CSS con la paleta de colores de UPEMOR */
        :root {
            --color-principal: #6A057F;  /* Morado/Púrpura */
            --color-acento-rojo: #E63946;    /* Rojo */
            --color-acento-naranja: #FFC300;     /* Naranja/Amarillo */
            --color-dark-hover: #4D035B; /* Morado más oscuro para hover */
            --color-text-light: #F0F2F5; /* Texto muy claro */
            --color-text-dark: #333333; /* Texto oscuro */
            --color-background-header: #FFFFFF; /* Fondo del header blanco */
        }

        /* Estilos generales */
        body {
            font-family: 'Arial', sans-serif; /* Usamos Arial para mantener la compatibilidad */
            margin: 0;
            padding: 0;
            background-color: var(--color-text-light);
            color: var(--color-text-dark);
            line-height: 1.6;
        }

        /* 1. Encabezado y Navegación */
        header {
            background-color: var(--color-background-header);
            padding: 15px 5%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--color-principal); /* Logo en Morado */
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .logo:hover {
            color: var(--color-acento-rojo); /* Logo a Rojo en hover */
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        nav ul li {
            margin-left: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--color-text-dark);
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 5px;
            transition: color 0.3s ease, transform 0.2s ease;
            position: relative;
        }
        
        /* Efecto de subrayado animado (Rojo) */
        nav ul li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--color-acento-rojo); /* Rojo */
            transition: width 0.3s ease-out;
        }

        nav ul li a:hover {
            color: var(--color-principal); /* Texto a Morado en hover */
            transform: translateY(-2px);
        }
        
        nav ul li a:hover::after {
            width: 100%;
        }

        /* 2. Sección principal (Hero) */
        .hero {
            text-align: center;
            padding: 120px 5%;
            /* Degradado de Morado a Rojo */
            background: linear-gradient(135deg, var(--color-principal) 0%, var(--color-acento-rojo) 100%);
            color: var(--color-text-light);
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-size: 3.5em;
            margin-bottom: 0.3em;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .hero h3 { /* Subtítulo de la plataforma */
            font-size: 1.8em;
            margin-bottom: 1.5em;
            font-weight: 400;
            opacity: 0.9;
        }

        .hero p {
            font-size: 1.3em;
            max-width: 800px;
            margin: 0 auto 3em auto;
            line-height: 1.8;
            opacity: 0.95;
        }

        /* 3. Botón "Más Información" (Naranja/Amarillo) */
        .boton-principal {
            display: inline-block;
            background-color: var(--color-acento-naranja); /* Fondo Naranja/Amarillo */
            color: var(--color-principal); /* Texto Morado */
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.15em;
            box-shadow: 0 6px 15px rgba(255, 195, 0, 0.3);
            transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
        }

        .boton-principal:hover {
            background-color: var(--color-principal); /* Fondo Morado en hover */
            color: var(--color-acento-naranja); /* Texto Naranja en hover */
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(106, 5, 127, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">EDUMATCH</a>
        <nav>
            <ul>
                <li><a href="principal.html">Inicio</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="inicio_sesion.html">Iniciar sesión</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="role-selection" class="login-card visible">
            <p class="university-title" style="text-align: center;">UNIVERSIDAD POLITÉCNICA DEL ESTADO DE MORELOS</p>

            <form>
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@upemor.edu.mx" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Recordar contraseña</label>
                </div>
                <button type="submit" class="btn-login">Acceder</button>
            </form>
            <button class="btn-back" onclick="showRoleSelection()">← Regresar a la selección de rol</button>
        </div>
    </main>

</body>
</html>
